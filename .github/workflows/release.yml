name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Remove development files
        run: |
          rm -rf tests
          rm -rf .git
          rm -rf .github

      - name: Create release package
        run: |
          mkdir -p release/feather-mysql

          cp -r bridge release/feather-mysql/
          cp -r lib release/feather-mysql/
          cp -r server release/feather-mysql/
          cp -r node_modules release/feather-mysql/

          cp fxmanifest.lua release/feather-mysql/
          cp package.json release/feather-mysql/
          cp package-lock.json release/feather-mysql/
          cp README.md release/feather-mysql/
          cp LICENSE release/feather-mysql/

          cd release
          zip -r feather-mysql.zip feather-mysql

      - name: Upload release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release/feather-mysql.zip \
            --clobber